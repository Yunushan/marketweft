[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "marketweft-research"
version = "0.1.0"
description = "Deterministic local time-series research through MarketWeft"
readme = "README.md"
license = "0BSD"
license-files = ["LICENSE"]
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
