[package]
name = "marketweft-desktop"
version = "0.194.0"
edition = "2021"
license = "0BSD"
publish = false
description = "Local MarketWeft research terminal"

[lib]
name = "marketweft_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

# Keep the optional webview toolchain out of core and BSD browser builds.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-workspace-backup = { path = "android-workspace-backup" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
native-smoke = []

# GTK3 consumers require the 0.18 API. See docs/native-advisories.md for
# the upstream archive, Debian backport, review gate and retirement criteria.
[patch.crates-io]
glib = { path = "vendor/glib-0.18.5" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "=0.18.5"

