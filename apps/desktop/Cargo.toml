[package]
name = "marketweft-desktop"
version = "0.1.0"
edition = "2021"
license = "0BSD"
publish = false
description = "Local MarketWeft research terminal"

# Keep the optional webview toolchain out of core and BSD browser builds.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

