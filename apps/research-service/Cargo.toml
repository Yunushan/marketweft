[package]
name = "marketweft-research-service"
version = "0.1.0"
edition = "2021"
license = "0BSD"

[workspace]

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
marketweft-core = { path = "../../crates/core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1.0"
subtle = "=2.6.1"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
