[package]
name = "marketweft-research-service"
version = "0.5.0"
edition = "2021"
license = "0BSD"

[workspace]

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "http2", "json", "tokio", "ws"] }
marketweft-core = { path = "../../crates/core" }
prost = "=0.14.6"
rusqlite = { version = "=0.43.0", features = ["backup", "bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1.0"
subtle = "=2.6.1"
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tonic = { version = "=0.14.9", default-features = false, features = ["channel", "codegen"] }
tonic-prost = "=0.14.9"

[build-dependencies]
protox = "=0.10.0"
tonic-prost-build = "=0.14.9"

[dev-dependencies]
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = "=0.29.0"
tower = { version = "=0.5.3", features = ["util"] }
