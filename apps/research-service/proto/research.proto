syntax = "proto3";

package marketweft.research.v1;

// Read-only historical research over local HTTP/2.
service Research {
  rpc EvaluateFormula(FormulaQuery) returns (FormulaPage);
  rpc GetMonthlyReturns(MonthlyReturnsQuery) returns (MonthlyReturnsPage);
  rpc GetMacroCalendar(MacroCalendarQuery) returns (MacroCalendarPage);
  rpc ScreenUniverse(ScreenQuery) returns (ScreenPage);
  rpc CompareUniverseRanks(RankComparisonQuery) returns (RankComparisonPage);
  rpc SnapshotOptions(OptionQuery) returns (OptionPage);
  rpc ValueAmericanOption(AmericanOptionQuery) returns (AmericanOptionResponse);
}

message FormulaFunction {
  string name = 1;
  repeated string parameters = 2;
  string body = 3;
}

message FormulaQuery {
  string formula = 1;
  string history_csv = 2;
  optional int64 observed_through = 3;
  repeated FormulaFunction functions = 4;
  optional uint64 offset = 5;
  optional uint64 limit = 6;
}

message FormulaRow {
  int64 observed_at = 1;
  // Exact six-place ticks. Absence means the value is unavailable.
  optional string value_ticks = 2;
}

message FormulaPage {
  uint32 language_version = 1;
  uint32 total_rows = 2;
  uint32 offset = 3;
  optional uint32 next_offset = 4;
  repeated FormulaRow rows = 5;
}

message MonthlyReturnsQuery {
  string history_csv = 1;
  uint32 first_year = 2;
  uint32 last_year = 3;
  string observed_through = 4;
  optional uint64 offset = 5;
  optional uint64 limit = 6;
}

message MonthlyReturnsClose {
  sint64 at = 1;
  string ticks = 2;
}

message MonthlyReturnsRow {
  uint32 year = 1;
  uint32 month = 2;
  string window = 3;
  optional MonthlyReturnsClose prior = 4;
  optional MonthlyReturnsClose current = 5;
  optional string percent_micros = 6;
}

message MonthlyReturnsPage {
  uint32 first_year = 1;
  uint32 last_year = 2;
  string observed_through = 3;
  uint32 total_rows = 4;
  uint32 offset = 5;
  optional uint32 next_offset = 6;
  repeated MonthlyReturnsRow rows = 7;
}

message MacroCalendarQuery {
  string csv = 1;
  string published_through = 2;
  string known_at = 3;
  optional uint64 offset = 4;
  optional uint64 limit = 5;
}

message MacroCalendarRow {
  string release_id = 1;
  string series_id = 2;
  sint64 reference_date = 3;
  string unit = 4;
  string record_id = 5;
  string kind = 6;
  sint64 published_at = 7;
  sint64 observed_at = 8;
  optional sint64 scheduled_at = 9;
  // Exact signed integer millionths in the declared unit.
  optional string value_ticks = 10;
  optional string supersedes = 11;
}

message MacroCalendarPage {
  string published_through = 1;
  string known_at = 2;
  uint32 total_releases = 3;
  uint32 total_rows = 4;
  uint32 offset = 5;
  optional uint32 next_offset = 6;
  repeated MacroCalendarRow rows = 7;
}

message ScreenQuery {
  string membership_csv = 1;
  string prices_csv = 2;
  string baseline_at = 3;
  string effective_at = 4;
  string known_at = 5;
  optional uint64 offset = 6;
  optional uint64 limit = 7;
}

message Close {
  string ticks = 1;
  int64 observed_at = 2;
}

message ScreenRow {
  string listing_id = 1;
  string instrument = 2;
  string membership_change_id = 3;
  int64 membership_effective_at = 4;
  int64 membership_observed_at = 5;
  optional uint32 rank = 6;
  // Exact 0.0001 percentage-point units, including values beyond int64.
  optional string return_units = 7;
  Close baseline = 8;
  Close current = 9;
}

message ScreenPage {
  string universe = 1;
  uint32 total_rows = 2;
  uint32 offset = 3;
  optional uint32 next_offset = 4;
  repeated ScreenRow rows = 5;
}


message RankComparisonQuery {
  string membership_csv = 1;
  string prices_csv = 2;
  string baseline_at = 3;
  string before_effective_at = 4;
  string before_known_at = 5;
  string after_effective_at = 6;
  string after_known_at = 7;
  optional uint64 offset = 8;
  optional uint64 limit = 9;
}

message RankComparisonLeg {
  // Membership evidence is absent when there was no known change for this listing.
  optional string status = 1;
  optional string change_id = 2;
  optional int64 effective_at = 3;
  optional int64 observed_at = 4;
  optional uint32 rank = 5;
  // Exact 0.0001 percentage-point units, including values beyond int64.
  optional string return_units = 6;
  Close baseline = 7;
  Close current = 8;
}

message RankComparisonRow {
  string listing_id = 1;
  string instrument = 2;
  RankComparisonLeg before = 3;
  RankComparisonLeg after = 4;
  // The before rank minus the after rank, present when both are ranked.
  optional sint64 rank_move = 5;
}

message RankComparisonPage {
  string universe = 1;
  string baseline_at = 2;
  string before_effective_at = 3;
  string before_known_at = 4;
  string after_effective_at = 5;
  string after_known_at = 6;
  uint32 total_rows = 7;
  uint32 offset = 8;
  optional uint32 next_offset = 9;
  repeated RankComparisonRow rows = 10;
}

message OptionQuery {
  string underlying_csv = 1;
  string quotes_csv = 2;
  string effective_at = 3;
  string known_at = 4;
  // Omit for the default of 300 seconds. Explicit zero requires a current quote.
  optional uint32 max_age = 5;
  optional uint64 offset = 6;
  optional uint64 limit = 7;
}

message OptionUnderlying {
  int64 quote_at = 1;
  int64 observed_at = 2;
  // Exact six-place ticks and units, represented as strings.
  string spot_ticks = 3;
  string rate_units = 4;
  string dividend_yield_units = 5;
}

message OptionModel {
  double volatility = 1;
  double price = 2;
  double delta = 3;
  double gamma = 4;
  double vega = 5;
  double theta = 6;
  double rho = 7;
}

message OptionRow {
  string contract_id = 1;
  int64 expiration = 2;
  string strike_ticks = 3;
  string side = 4;
  string exercise_style = 5;
  int64 quote_at = 6;
  int64 observed_at = 7;
  // Absence distinguishes a missing quote from a valid zero.
  optional string bid_ticks = 8;
  optional string ask_ticks = 9;
  string status = 10;
  OptionModel analytics = 11;
}

message OptionPage {
  string instrument = 1;
  string currency = 2;
  string effective_at = 3;
  string known_at = 4;
  OptionUnderlying underlying = 5;
  uint32 total_rows = 6;
  uint32 offset = 7;
  optional uint32 next_offset = 8;
  repeated OptionRow rows = 9;
}


message AmericanOptionQuery {
  string underlying_csv = 1;
  string quotes_csv = 2;
  string contract_id = 3;
  string effective_at = 4;
  string known_at = 5;
  // Omit to value against the underlying's continuous yield only.
  optional string cash_dividends_csv = 6;
  optional uint32 max_age = 7;
  optional uint32 steps = 8;
  // Omit to solve the quote midpoint. Explicit zero runs zero-volatility pricing.
  optional double volatility = 9;
}

message AppliedDividend {
  string id = 1;
  int64 announced_at = 2;
  int64 ex_at = 3;
  int64 pay_at = 4;
  int64 observed_at = 5;
  string currency = 6;
  // Exact six-place cash amount per share.
  string amount_per_share_ticks = 7;
}

message AmericanOptionResponse {
  string contract_id = 1;
  string currency = 2;
  string effective_at = 3;
  string known_at = 4;
  string status = 5;
  // Both fields are absent when valuation is unavailable.
  optional double price = 6;
  optional double volatility = 7;
  repeated AppliedDividend dividends = 8;
}
