name: Verify MarketWeft
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.8.2
          cache: npm
      - run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace --locked
      - run: node scripts/build-wasm.mjs
      - run: node --experimental-strip-types --test scripts/core-wasm.test.mjs
      - run: node --test scripts/serve-terminal.test.mjs
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: cargo fetch --manifest-path apps/desktop/Cargo.toml --locked
      - run: python3 -B scripts/test_supply_chain.py
      - run: python3 -B scripts/supply_chain.py --check
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
      - run: python3 scripts/package_browser.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-terminal
          path: reports/MarketWeft-browser-0.1.0.zip
          if-no-files-found: error

  desktop-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.8.2
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run build
      - run: cargo build --locked --manifest-path apps/desktop/Cargo.toml

  native-advisories:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - run: python3 -B scripts/advisories.py

