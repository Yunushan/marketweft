name: Verify MarketWeft
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.publish.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.8.2
          cache: npm
      - run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace --locked
      - run: node scripts/build-wasm.mjs
      - run: node --experimental-strip-types --test scripts/core-wasm.test.mjs
      - run: node --test scripts/serve-terminal.test.mjs
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: cargo fetch --manifest-path apps/desktop/Cargo.toml --locked
      - run: cargo fetch --manifest-path apps/research-service/Cargo.toml --locked
      - run: cargo fmt --manifest-path apps/research-service/Cargo.toml -- --check
      - run: cargo clippy --manifest-path apps/research-service/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/research-service/Cargo.toml --locked
      - run: python3 -B scripts/test_supply_chain.py
      - run: python3 -B scripts/test_desktop_baseline.py
      - run: python3 -B scripts/supply_chain.py --check
      - run: python3 -B scripts/core_notices.py --check
      - run: python3 -B scripts/check_readmes.py
      - name: Build and test the standalone localhost research service
        run: |
          manifest=apps/research-service/Cargo.toml
          binary=apps/research-service/target/release/marketweft-research-service
          cargo build --locked --release --manifest-path "$manifest"
          python3 -B apps/research-service/tests/loopback_smoke.py "$binary"
          python3 -B apps/research-service/tests/operations_smoke.py "$binary"
          python3 -B apps/research-service/tests/shutdown_smoke.py "$binary"
          MARKETWEFT_TEST_BINARY="$PWD/$binary" cargo test --locked --manifest-path "$manifest" --test local_websocket --test local_grpc --test local_audit --test local_audit_recovery --test local_admission --test local_credentials --test local_tls --test private_deployment --test portfolio_scenarios_service --test portfolio_fx_service --test equity_concentration_service --test notional_bars_service --test listing_downside_service
          python3 -B scripts/package_research_service.py "$binary"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: research-service-linux-x64-attempt-${{ github.run_attempt }}
          path: reports/MarketWeft-research-service-*-linux-x64.tar.gz
          if-no-files-found: error
      - name: Build and verify the non-root research OCI archive
        run: python3 -B scripts/package_research_oci.py reports/MarketWeft-research-service-*-linux-x64.tar.gz
      - name: Verify private Compose restart and recovery
        run: |
          version="$(node -p 'require("./package.json").version')"
          python3 -B scripts/smoke_research_compose.py "marketweft-research:$version"
      - name: Verify private Kubernetes restart and recovery
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/kind" \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          printf '%s  %s\n' aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d "$RUNNER_TEMP/kind" | sha256sum --check
          chmod +x "$RUNNER_TEMP/kind"
          PATH="$RUNNER_TEMP:$PATH" python3 -B scripts/smoke_research_kubernetes.py reports/MarketWeft-research-service-*-linux-x64-oci.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: research-oci-linux-x64-attempt-${{ github.run_attempt }}
          path: reports/MarketWeft-research-service-*-linux-x64-oci.tar
          if-no-files-found: error
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
        env:
          MARKETWEFT_TEST_RESEARCH_WEBHOOK: ${{ github.workspace }}/apps/research-service/target/release/marketweft-research-service
      - name: Pack and install the research SDK offline
        run: |
          mkdir -p reports
          npm pack --workspace @marketweft/research --pack-destination reports
          version="$(node -p 'require("./packages/research/package.json").version')"
          archive="$PWD/reports/marketweft-research-$version.tgz"
          consumer="$(mktemp -d)"
          printf '{"name":"research-sdk-smoke","private":true}\n' > "$consumer/package.json"
          npm --prefix "$consumer" install --offline --ignore-scripts --no-audit --no-fund "$archive"
          cd "$consumer"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFile } from 'node:fs/promises'
          import { join } from 'node:path'
          import { createResearchEngine, MARKET_CORE_WASM_URL, RESEARCH_SDK_VERSION } from '@marketweft/research'

          const research = await createResearchEngine(await readFile(new URL(MARKET_CORE_WASM_URL)))
          const bars = research.parseBars('time,open,high,low,close,volume\n2025-04-03T14:00:00Z,10,10,10,10,20\n')
          assert.equal(research.version, RESEARCH_SDK_VERSION)
          assert.deepEqual(research.evaluateFormula('close + 0.000001', bars).values, [10000001n])
          const fixture = name => readFile(join(process.env.GITHUB_WORKSPACE, 'crates/core/tests/fixtures', name), 'utf8')
          const releases = await fixture('synthetic-macro-calendar.csv')
          const macro = known => research.macroAsOf(releases, '2025-04-03T14:50:00Z', known)[0]
          assert.deepEqual(macro('2025-04-03T14:31:59Z').actualHistory, [])
          assert.deepEqual(macro('2025-04-03T14:52:00Z').actualHistory.map(row => [row.value, row.supersedes]), [
            [2700000n, null], [2600000n, 'CPI-A0'], [2800000n, 'CPI-A1'],
          ])
          const [membership, prices] = await Promise.all([
            fixture('synthetic-universe.csv'), fixture('synthetic-universe-prices.csv'),
          ])
          const rank = known => research.universeScreen(
            membership, prices, '2025-06-02T14:00:00Z', '2025-06-02T14:10:00Z', known,
          ).map(row => [row.listingId, row.rank, row.returnUnits])
          assert.deepEqual(rank('2025-06-02T14:10:00Z'), [['ALFA-001', 1, 20000n], ['BETA-001', null, null]])
          assert.deepEqual(rank('2025-06-02T14:12:00Z'), [['BETA-001', 1, 120000n], ['ALFA-001', 2, 20000n]])
          const [jointMembership, jointPrices] = await Promise.all([
            fixture('synthetic-listing-risk-membership.csv'), fixture('synthetic-listing-risk-prices.csv'),
          ])
          const joint = research.portfolioScenarios(jointMembership, jointPrices,
            [{ listingId: 'A', weightBasisPoints: 5000 }, { listingId: 'B', weightBasisPoints: 5000 }], {
              from: '2025-06-02T14:00:00Z', through: '2025-06-02T14:06:00Z', known: '2025-06-02T14:06:00Z',
              intervalSeconds: 60, startingValue: '100', feeBasisPoints: 100,
              seed: 9007199254740993n, paths: 1, horizon: 4, blockSize: 3,
            })
          assert.equal(joint.eligibleBlocks, 1)
          assert.deepEqual(joint.paths, [{ endingValue: 99950000n, drawdownMillionths: 500n, fees: 50000n }])
          const fxRates = await fixture('synthetic-portfolio-fx.csv')
          const translate = known => research.portfolioFxAsOf(fxRates, 'USD', '2025-06-02T14:45:00Z', known,
            [{ currency: 'EUR', subtotal: 225000000n }, { currency: 'USD', subtotal: 70000000n }])
          assert.equal(translate('2025-06-02T14:45:00Z').rows[0].converted, null)
          assert.equal(translate('2025-06-02T14:46:00Z').knownSubtotal, 340000000n)
          assert.equal(translate('2025-06-02T14:49:00Z').knownSubtotal, 362500000n)
          const [equityMembership, equityHoldings, equityCloses] = await Promise.all([
            fixture('synthetic-universe.csv'), fixture('synthetic-portfolio-holdings.csv'), fixture('synthetic-universe-prices.csv'),
          ])
          const concentration = known => research.equityConcentrationAsOf(equityMembership, equityHoldings,
            equityCloses, '2025-06-02T14:10:00Z', known).groups[0]
          assert.equal(concentration('2025-06-02T14:10:00Z').positions[1].mark, null)
          assert.equal(concentration('2025-06-02T14:12:00Z').positions[0].weightMicros, 73298429n)
          assert.equal(concentration('2025-06-02T14:16:00Z').positions[0].weightMicros, 71227080n)

          const [underlying, quotes, cash] = await Promise.all([
            fixture('synthetic-option-underlying.csv'), fixture('synthetic-option-exercise-quotes.csv'),
            fixture('synthetic-option-cash-dividends.csv'),
          ])
          const effective = '2025-04-03T14:00:00Z'
          const contract = 'APR-AM-C90'
          assert.equal(research.optionIndex(underlying, quotes).currency, 'USD')
          assert.ok(!research.optionSnapshot(underlying, quotes, effective, effective, 300).options.some(row => row.id === contract))
          const observe = known => research.americanOptionCashImplied(underlying, quotes, cash, contract, effective, known, 300, 128)
          const first = observe('2025-04-03T14:04:00Z')
          const revised = observe('2025-04-03T14:06:00Z')
          assert.equal(revised.price.toFixed(6), '16.234568')
          assert.equal((revised.volatility * 100).toFixed(2), '32.53')
          assert.deepEqual(first.dividends.map(row => row.amountPerShare), [7000000n])
          assert.deepEqual(revised.dividends.map(row => row.amountPerShare), [1000000n, 9000000n])
          assert.deepEqual(observe('2025-04-03T14:04:00Z'), first)
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: research-sdk-attempt-${{ github.run_attempt }}
          path: reports/marketweft-research-*.tgz
          if-no-files-found: error
      - name: Verify the installed Python research SDK
        run: |
          cargo build --locked --release -p marketweft-core --bin marketweft-research
          builder="$RUNNER_TEMP/marketweft-py-builder"
          consumer="$RUNNER_TEMP/marketweft-py-consumer"
          python3 -m venv "$builder"
          "$builder/bin/python" -m pip install --disable-pip-version-check --require-hashes \
            --only-binary=:all: -r packages/python-research/build-requirements.txt
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            "$builder/bin/python" -m pip wheel --disable-pip-version-check --no-deps --no-build-isolation \
            --wheel-dir reports packages/python-research
          python3 -m venv "$consumer"
          "$consumer/bin/python" -m pip install --no-index --no-deps reports/marketweft_research-*.whl
          "$consumer/bin/python" -B -m unittest discover -v -s packages/python-research/tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-research-sdk-attempt-${{ github.run_attempt }}
          path: reports/marketweft_research-*.whl
          if-no-files-found: error
      - name: Match a release tag to the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: python3 scripts/package_browser.py
      - name: Verify the portable terminal offline in Firefox and WebKit
        run: |
          npx --no-install playwright install --with-deps firefox webkit
          package="MarketWeft-browser-$(node -p 'require("./package.json").version').zip"
          portable="$RUNNER_TEMP/marketweft-portable"
          unzip -q "reports/$package" -d "$portable"
          MARKETWEFT_PORTABLE_ROOT="$portable" node --test scripts/portable-browser-engines.test.mjs
          for engine in firefox webkit; do
            MARKETWEFT_PORTABLE_ROOT="$portable" npx --no-install playwright test \
              -c apps/terminal/playwright.config.mjs --browser "$engine" portable-upgrade.spec.mjs
          done
      - id: publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-terminal-attempt-${{ github.run_attempt }}
          path: reports/MarketWeft-browser-*.zip
          if-no-files-found: error
      - name: Download and verify the published browser artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.publish.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.publish.outputs.artifact-digest }}
        run: |
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          digest="${ARTIFACT_DIGEST#sha256:}"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          archive="$RUNNER_TEMP/browser-artifact.zip"
          package="MarketWeft-browser-$(node -p 'require("./package.json").version').zip"
          # Artifact listings can lag the upload or return inconsistent cached results.
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --retry 5 --retry-all-errors --retry-max-time 60 --max-time 20 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --output "$archive" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"
          printf '%s  %s\n' "$digest" "$archive" | sha256sum --check --strict
          unzip -p "$archive" "$package" > "$RUNNER_TEMP/$package"
          cmp "reports/$package" "$RUNNER_TEMP/$package"

  attest-browser:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          github-token: ${{ github.token }}
          path: distribution
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: distribution/MarketWeft-browser-*.zip

  attest-desktop:
    needs: [verify, desktop-build, native-advisories]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu
            runner: ubuntu-24.04
            artifact-stem: ubuntu-desktop
            arches: X64|ARM64
            extension: deb
          - platform: windows
            runner: ubuntu-24.04
            artifact-stem: windows-desktop
            arches: x64|arm64
            extension: exe
          - platform: macos
            runner: macos-15
            artifact-stem: macos-disk-image
            arches: x64|arm64
            extension: dmg
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Find the verified desktop artifacts for this run
        id: packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_STEM: ${{ matrix.artifact-stem }}
          ARCHES: ${{ matrix.arches }}
        run: |
          pattern="^${ARTIFACT_STEM}-(?<arch>${ARCHES})-attempt-(?<attempt>[1-9][0-9]*)$"
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" |
            jq -ser --arg pattern "$pattern" --argjson attempt "$GITHUB_RUN_ATTEMPT" '
              [.[].artifacts[] | select(.expired | not) |
                (.name | capture($pattern)) as $name |
                {id, arch: $name.arch, attempt: ($name.attempt | tonumber)} |
                select(.attempt <= $attempt)] |
              group_by(.arch) | map(max_by(.attempt).id) |
              if length == 2 then join(",") else error("Expected both desktop architectures") end')
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.packages.outputs.ids }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: distribution
      - name: Verify the Ubuntu package subjects and source commit
        if: matrix.platform == 'ubuntu'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          shopt -s nullglob
          packages=(distribution/*.deb)
          test "${#packages[@]}" -eq 2
          for arch in amd64 arm64; do
            filename="marketweft-desktop_${version}_${arch}.deb"
            package="distribution/$filename"
            test "$(dpkg-deb -f "$package" Package)" = marketweft-desktop
            test "$(dpkg-deb -f "$package" Version)" = "$version"
            test "$(dpkg-deb -f "$package" Architecture)" = "$arch"
            digest=$(sha256sum "$package")
            test "$(cat "$package.sha256")" = "${digest%% *}  $filename"
            revision=$(dpkg-deb --fsys-tarfile "$package" |
              tar -xOf - ./usr/share/doc/marketweft-desktop/source-revision)
            test "$revision" = "$GITHUB_SHA"
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.platform == 'windows' || matrix.platform == 'macos'
        with:
          path: source
          persist-credentials: false
      - name: Verify the Windows installer subjects and source commit
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          if ! command -v 7z >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends p7zip-full
          fi
          cd source
          bash scripts/verify_windows_installer_subjects.sh "${GITHUB_REF_NAME#v}" "$GITHUB_SHA" ../distribution
      - name: Verify the macOS disk-image subjects and source commit
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          cd source
          bash scripts/verify_macos_disk_image_subjects.sh "${GITHUB_REF_NAME#v}" "$GITHUB_SHA" ../distribution
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        id: sign
        with:
          subject-path: distribution/*.${{ matrix.extension }}
      - name: Verify both signed packages against this tag and commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION: ${{ steps.sign.outputs.bundle-path }}
          PLATFORM: ${{ matrix.platform }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          for package in distribution/*."$EXTENSION"; do
            gh attestation verify "$package" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/verify.yml" \
              --deny-self-hosted-runners --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" \
              --bundle "$ATTESTATION"
          done
          cp "$ATTESTATION" "distribution/marketweft-$PLATFORM-desktop.intoto.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform }}-desktop-signed-attempt-${{ github.run_attempt }}
          path: distribution/*
          if-no-files-found: error

  desktop-build:
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-11-arm, macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.8.2
          cache: npm
      - name: Verify the native Windows ARM64 host and toolchain
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $nodeArch = node -p 'process.arch'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler = rustc -vV
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:RUNNER_ARCH -cne 'ARM64' -or $nodeArch -cne 'arm64' -or 'host: aarch64-pc-windows-msvc' -cnotin $compiler) {
            throw 'Expected a Windows ARM64 runner with native Node.js and Rust.'
          }
          Write-Output "Runner architecture $env:RUNNER_ARCH and Node.js architecture $nodeArch"
          $compiler
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xvfb xauth dbus-x11 xdotool python3-pyatspi at-spi2-core webkit2gtk-driver dpkg-dev desktop-file-utils
      - run: npm ci
      - run: npm run build
      - run: cargo build --locked --release -p marketweft-core --bin marketweft-research
      - name: Run the Python research fixture against the native executable
        env:
          PYTHONPATH: packages/python-research/src
        run: python -B -m unittest discover -v -s packages/python-research/tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-research-engine-${{ matrix.os }}-${{ runner.arch }}-attempt-${{ github.run_attempt }}
          path: target/release/marketweft-research${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
      - run: cargo build --locked --release --manifest-path apps/desktop/Cargo.toml
      - name: Verify the native Windows PE architectures
        if: runner.os == 'Windows'
        env:
          MACHINE: ${{ matrix.os == 'windows-11-arm' && 'arm64' || 'x64' }}
        shell: pwsh
        run: |
          python -B scripts/verify_windows_arch.py $env:MACHINE target/release/marketweft-research.exe apps/desktop/target/release/marketweft-desktop.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify the Windows x64 installer and the installed WebView2
        if: matrix.os == 'windows-2022'
        timeout-minutes: 10
        shell: pwsh
        run: |
          if ($env:RUNNER_ARCH -cne 'X64') { throw 'Expected an x64 Windows runner.' }
          $driver = & scripts/stage_edge_webdriver.ps1 -Architecture x64 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'marketweft-webview2-driver')
          python -B scripts/verify_windows_arch.py x64 $driver
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & scripts/verify_desktop_windows.ps1 -Binary apps/desktop/target/release/marketweft-desktop.exe -Driver $driver -WorkRoot $env:RUNNER_TEMP
      - name: Verify the Windows ARM64 installer and the installed WebView2
        if: matrix.os == 'windows-11-arm'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $desktop = 'apps/desktop/target/release/marketweft-desktop.exe'
          $production = Join-Path $env:RUNNER_TEMP 'marketweft-desktop-arm64-release.exe'
          Copy-Item -LiteralPath $desktop -Destination $production
          cargo build --locked --release --manifest-path apps/desktop/Cargo.toml --features native-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash -LiteralPath $desktop).Hash -eq (Get-FileHash -LiteralPath $production).Hash) {
            throw 'The ARM64 verification executable must be distinct from the release executable.'
          }
          & scripts/verify_desktop_windows.ps1 -Architecture arm64 -Binary $production -SmokeBinary $desktop -WorkRoot $env:RUNNER_TEMP
      - name: Upgrade the installed Windows desktop and reopen its saved workspace
        if: runner.os == 'Windows'
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MACHINE: ${{ matrix.os == 'windows-11-arm' && 'arm64' || 'x64' }}
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $desktop = 'apps/desktop/target/release/marketweft-desktop.exe'
          $options = @{
            Architecture = $env:MACHINE
            Candidate = "reports/MarketWeft-desktop-$version-windows-$($env:MACHINE)-setup.exe"
            CandidateBinary = $desktop
            WorkRoot = $env:RUNNER_TEMP
            BaselineRun = 46001373065
            BaselineCommit = 'e5b59b7b99a22986a1ec4013484a05d1da0298a2'
            BaselineVersion = '0.168.0'
          }
          if ($env:MACHINE -eq 'arm64') {
            $options.CandidateBinary = Join-Path $env:RUNNER_TEMP 'marketweft-desktop-arm64-release.exe'
            $options.CandidateSmoke = $desktop
          } else {
            $options.Driver = Join-Path $env:RUNNER_TEMP 'marketweft-webview2-driver/msedgedriver.exe'
          }
          & scripts/verify_windows_desktop_upgrade.ps1 @options
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Windows'
        with:
          name: windows-desktop-${{ matrix.os == 'windows-11-arm' && 'arm64' || 'x64' }}-attempt-${{ github.run_attempt }}
          path: reports/MarketWeft-desktop-*-windows-*-setup.exe*
          if-no-files-found: error
      - name: Verify the native macOS host and Mach-O binaries
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACHINE: ${{ matrix.os == 'macos-15-intel' && 'x86_64' || 'arm64' }}
          HOST_ARCH: ${{ matrix.os == 'macos-15-intel' && 'X64' || 'ARM64' }}
        run: |
          printf 'Host architecture %s (%s)\n' "$(uname -m)" "$RUNNER_ARCH"
          test "$RUNNER_ARCH" = "$HOST_ARCH"
          test "$(uname -m)" = "$MACHINE"
          for binary in target/release/marketweft-research apps/desktop/target/release/marketweft-desktop; do
            architecture=$(xcrun lipo -archs "$binary")
            printf '%s Mach-O architecture %s\n' "$binary" "$architecture"
            test "$architecture" = "$MACHINE"
          done
      - name: Verify the macOS application bundle and its native WKWebView
        if: runner.os == 'macOS'
        timeout-minutes: 10
        shell: bash
        env:
          ARCHITECTURE: ${{ matrix.os == 'macos-15-intel' && 'x64' || 'arm64' }}
        run: |
          desktop=apps/desktop/target/release/marketweft-desktop
          production="$RUNNER_TEMP/marketweft-desktop-macos-release"
          cp "$desktop" "$production"
          cargo build --locked --release --manifest-path apps/desktop/Cargo.toml --features native-smoke
          if cmp -s "$production" "$desktop"; then
            echo 'The macOS verification executable must be distinct from the release executable.'
            exit 1
          fi
          bash scripts/verify_desktop_macos.sh "$production" "$desktop" "$ARCHITECTURE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'macOS'
        with:
          name: macos-desktop-${{ matrix.os == 'macos-15-intel' && 'x64' || 'arm64' }}-attempt-${{ github.run_attempt }}
          path: reports/MarketWeft-desktop-*-macos-*.zip*
          if-no-files-found: error
      - name: Verify the mounted macOS disk image and copied application
        if: runner.os == 'macOS'
        timeout-minutes: 5
        shell: bash
        env:
          ARCHITECTURE: ${{ matrix.os == 'macos-15-intel' && 'x64' || 'arm64' }}
        run: bash scripts/verify_desktop_macos_disk_image.sh "$ARCHITECTURE"
      - name: Upgrade the copied macOS app and reopen its saved workspace
        if: runner.os == 'macOS'
        timeout-minutes: 25
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARCHITECTURE: ${{ matrix.os == 'macos-15-intel' && 'x64' || 'arm64' }}
        run: |
          bash scripts/verify_macos_desktop_upgrade.sh "$ARCHITECTURE" \
            46007400230 ac42f212704e788e1a085443f82fbdcf581e16f9 0.172.0
      - name: Import a CSV through the production macOS file picker
        if: runner.os == 'macOS'
        timeout-minutes: 10
        shell: bash
        env:
          ARCHITECTURE: ${{ matrix.os == 'macos-15-intel' && 'x64' || 'arm64' }}
        run: bash scripts/verify_macos_native_file_picker.sh "$ARCHITECTURE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'macOS' && (success() || failure())
        with:
          name: macos-file-picker-${{ matrix.os == 'macos-15-intel' && 'x64' || 'arm64' }}-attempt-${{ github.run_attempt }}
          path: reports/macos-file-picker-*.xcresult/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'macOS'
        with:
          name: macos-disk-image-${{ matrix.os == 'macos-15-intel' && 'x64' || 'arm64' }}-attempt-${{ github.run_attempt }}
          path: reports/MarketWeft-desktop-*-macos-*.dmg*
          if-no-files-found: error
      - name: Verify the native Linux ARM64 host and desktop executable
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = aarch64
          readelf -h apps/desktop/target/release/marketweft-desktop | grep -E 'Machine:[[:space:]]+AArch64'
      - if: runner.os == 'Linux'
        run: cargo test --locked --release --manifest-path apps/desktop/Cargo.toml --test glib_variant_iter
      - name: Verify the Ubuntu desktop installer and installed WebView
        if: runner.os == 'Linux'
        run: sh scripts/verify_desktop_deb.sh apps/desktop/target/release/marketweft-desktop
      - name: Upgrade the verified Ubuntu package and reopen its workspace
        if: runner.os == 'Linux'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sh scripts/verify_published_desktop_upgrade.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          name: ubuntu-desktop-${{ runner.arch }}-attempt-${{ github.run_attempt }}
          path: reports/marketweft-desktop_*.deb*
          if-no-files-found: error

  android-build:
    permissions:
      contents: read
      actions: read
    outputs:
      arm64-artifact-id: ${{ steps.publish-arm64.outputs.artifact-id }}
      x64-artifact-id: ${{ steps.publish-x64.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.8.2
          cache: npm
      - name: Set isolated Gradle and Android directories
        run: |
          mkdir -p "$RUNNER_TEMP/marketweft-android"
          printf 'GRADLE_USER_HOME=%s\nANDROID_USER_HOME=%s\n' \
            "$RUNNER_TEMP/marketweft-gradle" "$RUNNER_TEMP/marketweft-android" >> "$GITHUB_ENV"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$ANDROID_HOME/platform-tools/adb"
          printf '%s\n' "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Restore downloaded Android dependencies
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/marketweft-gradle/caches/modules-2/files-2.1
            ${{ runner.temp }}/marketweft-gradle/caches/modules-2/metadata-*
          key: android-gradle-modules-v1-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/desktop/android-workspace-backup/android/*.gradle.kts') }}
          restore-keys: android-gradle-modules-v1-${{ runner.os }}-
      - run: npm ci
      - run: npm run build
      - name: Build the x86_64 MarketWeft Android test APK
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          export NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          if [[ ! -d "$NDK_HOME" ]]; then
            sdkmanager --install 'ndk;29.0.14206865'
          fi
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar" ||
            sdkmanager --install 'platforms;android-37.0'
          test -x "$ANDROID_HOME/build-tools/37.0.0/apksigner" ||
            sdkmanager --install 'build-tools;37.0.0'
          bash scripts/build_android_terminal.sh
      - name: Save downloaded Android dependencies
        if: github.event_name == 'push' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/marketweft-gradle/caches/modules-2/files-2.1
            ${{ runner.temp }}/marketweft-gradle/caches/modules-2/metadata-*
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
      - name: Build and inspect the ARM64 MarketWeft Android test APK
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          export NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          bash scripts/build_android_terminal.sh arm64-v8a
          version=$(node -p 'require("./package.json").version')
          name="MarketWeft-android-$version-arm64-v8a-debug.apk"
          bash scripts/verify_android_package.sh "reports/$name" arm64-v8a
          (cd reports && sha256sum "$name" >"$name.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: publish-arm64
        with:
          name: android-terminal-arm64-v8a-attempt-${{ github.run_attempt }}
          path: reports/MarketWeft-android-*-arm64-v8a-debug.apk*
          if-no-files-found: error
      - name: Retrieve the verified Android upgrade baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -B scripts/download_desktop_baseline.py --platform android --architecture x86_64 \
            --run 46020277918 --commit cfb2fd6749a94e9b51f7a30e5165d3e768b1e124 --version 0.177.0 \
            --output "$RUNNER_TEMP/marketweft-android-baseline"
      - name: Verify the installed Android terminal offline
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          bash scripts/verify_android_terminal.sh \
            "$RUNNER_TEMP/marketweft-android-baseline/MarketWeft-android-0.177.0-x86_64-debug.apk" \
            0.177.0 cfb2fd6749a94e9b51f7a30e5165d3e768b1e124
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: publish-x64
        with:
          name: android-terminal-x86_64-attempt-${{ github.run_attempt }}
          path: reports/MarketWeft-android-*-x86_64-debug.apk*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || failure()
        with:
          name: android-terminal-evidence-attempt-${{ github.run_attempt }}
          path: reports/android-*
          if-no-files-found: ignore

  attest-android:
    needs: [verify, android-build, native-advisories]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.android-build.outputs.arm64-artifact-id }},${{ needs.android-build.outputs.x64-artifact-id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: distribution
      - name: Verify the Android debug APKs for this tag and source commit
        run: bash scripts/verify_android_apk_subjects.sh "${GITHUB_REF_NAME#v}" "$GITHUB_SHA" distribution
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        id: sign
        with:
          subject-path: distribution/*.apk
      - name: Verify both attestations against this tag and source commit
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION: ${{ steps.sign.outputs.bundle-path }}
        run: |
          for package in distribution/*.apk; do
            gh attestation verify "$package" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/verify.yml" \
              --deny-self-hosted-runners --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" \
              --bundle "$ATTESTATION"
          done
          cp "$ATTESTATION" distribution/marketweft-android.intoto.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-terminal-attested-attempt-${{ github.run_attempt }}
          path: distribution/*
          if-no-files-found: error

  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.8.2
          cache: npm
      - name: Open the pinned Xcode toolchain and install XcodeGen if needed
        run: |
          xcodebuild -version
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          xcodegen --version
      - run: npm ci
      - run: npm run build
      - name: Retrieve the verified iOS Simulator upgrade baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -B scripts/download_desktop_baseline.py --platform ios-simulator --architecture arm64 \
            --run 46020348246 --commit d6f88d4b91a972e4696373d8d8884a66d9ab092d --version 0.178.0 \
            --output "$RUNNER_TEMP/marketweft-ios-baseline"
      - name: Build and verify the installed iPhone and iPad simulator terminal
        run: |
          bash scripts/verify_ios_simulator.sh \
            "$RUNNER_TEMP/marketweft-ios-baseline/MarketWeft-ios-simulator-0.178.0-arm64.zip" \
            0.178.0 d6f88d4b91a972e4696373d8d8884a66d9ab092d
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-simulator-arm64-attempt-${{ github.run_attempt }}
          path: reports/MarketWeft-ios-simulator-*-arm64.zip*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || failure()
        with:
          name: ios-simulator-evidence-attempt-${{ github.run_attempt }}
          path: |
            reports/ios-simulator-*.xcresult/
            reports/ios-simulator-*-relaunch.txt
            reports/ios-simulator-*-restored-workspace.marketweft.json
          if-no-files-found: ignore

  native-advisories:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B scripts/advisories.py

