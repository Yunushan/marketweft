name: Verify MarketWeft
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.publish.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.8.2
          cache: npm
      - run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace --locked
      - run: node scripts/build-wasm.mjs
      - run: node --experimental-strip-types --test scripts/core-wasm.test.mjs
      - run: node --test scripts/serve-terminal.test.mjs
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: cargo fetch --manifest-path apps/desktop/Cargo.toml --locked
      - run: python3 -B scripts/test_supply_chain.py
      - run: python3 -B scripts/supply_chain.py --check
      - run: python3 -B scripts/check_readmes.py
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
      - name: Match a release tag to the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: python3 scripts/package_browser.py
      - id: publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-terminal-attempt-${{ github.run_attempt }}
          path: reports/MarketWeft-browser-*.zip
          if-no-files-found: error
      - name: Download and verify the published browser artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.publish.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.publish.outputs.artifact-digest }}
        run: |
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          digest="${ARTIFACT_DIGEST#sha256:}"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          archive="$RUNNER_TEMP/browser-artifact.zip"
          package="MarketWeft-browser-$(node -p 'require("./package.json").version').zip"
          # Artifact listings can lag the upload or return inconsistent cached results.
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --retry 5 --retry-all-errors --retry-max-time 60 --max-time 20 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --output "$archive" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"
          printf '%s  %s\n' "$digest" "$archive" | sha256sum --check --strict
          unzip -p "$archive" "$package" > "$RUNNER_TEMP/$package"
          cmp "reports/$package" "$RUNNER_TEMP/$package"

  attest-browser:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          github-token: ${{ github.token }}
          path: distribution
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: distribution/MarketWeft-browser-*.zip

  desktop-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.8.2
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xvfb xauth dbus-x11 xdotool python3-pyatspi at-spi2-core
      - run: npm ci
      - run: npm run build
      - run: cargo build --locked --manifest-path apps/desktop/Cargo.toml
      - if: runner.os == 'Linux'
        run: cargo test --locked --manifest-path apps/desktop/Cargo.toml --test glib_variant_iter
      - if: runner.os == 'Linux'
        run: PATH="/usr/bin:$PATH" sh apps/desktop/tests/smoke-x11.sh apps/desktop/target/debug/marketweft-desktop

  native-advisories:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B scripts/advisories.py

