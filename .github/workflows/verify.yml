name: Verify MarketWeft
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.8.2
          cache: npm
      - run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace --locked
      - run: node scripts/build-wasm.mjs
      - run: node --experimental-strip-types --test scripts/core-wasm.test.mjs
      - run: node --test scripts/serve-terminal.test.mjs
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: cargo fetch --manifest-path apps/desktop/Cargo.toml --locked
      - run: python3 -B scripts/test_supply_chain.py
      - run: python3 -B scripts/supply_chain.py --check
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
      - name: Match a release tag to the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: python3 scripts/package_browser.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-terminal
          path: reports/MarketWeft-browser-0.1.0.zip
          if-no-files-found: error
      - name: Download the published browser artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-terminal
          path: ${{ runner.temp }}/browser-artifact
      - name: Verify the downloaded ZIP matches the tested package
        run: cmp reports/MarketWeft-browser-*.zip "$RUNNER_TEMP"/browser-artifact/MarketWeft-browser-*.zip

  attest-browser:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-terminal
          path: distribution
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: distribution/MarketWeft-browser-*.zip

  desktop-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.8.2
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xvfb xauth dbus-x11 xdotool python3-pyatspi at-spi2-core
      - run: npm ci
      - run: npm run build
      - run: cargo build --locked --manifest-path apps/desktop/Cargo.toml
      - if: runner.os == 'Linux'
        run: cargo test --locked --manifest-path apps/desktop/Cargo.toml --test glib_variant_iter
      - if: runner.os == 'Linux'
        run: PATH="/usr/bin:$PATH" sh apps/desktop/tests/smoke-x11.sh apps/desktop/target/debug/marketweft-desktop

  native-advisories:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B scripts/advisories.py

